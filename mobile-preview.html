<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 미리보기</title>
<style>
  html,body{margin:0;background:#dfe7e3;font-family:sans-serif}
  .wrap{display:flex;justify-content:center;padding:16px}
  .phone{width:390px;height:844px;border-radius:28px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25);background:#fff}
  iframe{width:390px;height:844px;border:0;display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="phone">
    <iframe id="frame" src="./" title="코리아 에코크린 모바일 미리보기" width="390" height="844"></iframe>
<script>document.getElementById("frame").src = "./?cb=" + Date.now();</script>
  </div>
</div>
</body>
</html>
