<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>preview</title>
<style>
  html, body { margin: 0; padding: 0; background: #e9eef2; }
  iframe { border: 0; display: block; background: #fff; }
</style>
</head>
<body>
<iframe id="f" title="코리아 에코크린 미리보기" width="1440" height="900" src="/"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get('w') || '1440', 10);
  var h = parseInt(q.get('h') || '900', 10);
  var f = document.getElementById('f');
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  f.width = w;
  f.height = h;
  f.addEventListener('load', function () {
    try {
      var d = f.contentDocument;
      if (q.get('nosb') === '1') {
        d.documentElement.style.scrollbarWidth = 'none';
      }
      if (q.get('full') === '1') {
        var H = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight);
        f.style.height = H + 'px';
        f.height = H;
      }
      if (q.get('eager') === '1') {
        d.querySelectorAll('img[loading="lazy"]').forEach(function (i) {
          var s = i.getAttribute('src');
          i.removeAttribute('loading');
          i.setAttribute('src', '');
          i.setAttribute('src', s);
        });
      }
      document.title = 'ready w=' + w + ' h=' + f.height + ' wd=' + d.documentElement.clientWidth;
    } catch (e) {
      document.title = 'iframe-error';
    }
  });
</script>
</body>
</html>
