<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex">

<link rel="stylesheet" href="/styles.css">
<style>
  .e404 { min-height: 72vh; display: grid; place-items: center; text-align: center; padding: 60px 24px; }

  .e404 .btn { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; padding: 13px 24px; border-radius: 999px; }
  .e404 .home { background: #12784c; color: #fff; }

<body>

    <div class="btns">
